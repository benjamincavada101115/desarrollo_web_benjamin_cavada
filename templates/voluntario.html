<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registrar voluntarios</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <p> 
            <a href="{{ url_for('index') }}">Volver</a>
        </p>

        <h1>Registrar Voluntarios</h1>
        <form id = "form-voluntario" method="POST" action="{{ url_for('registrar_voluntario') }}">
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
                <span class="error" id="error-nombre">Debe ingresar un nombre (mínimo 3 caracteres).</span>
            </p>
            <p>
                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" name="apellido" required>
                <span class="error" id="error-apellido">Debe ingresar un apellido (mínimo 3 caracteres).</span>
            </p>
            <p>
                <label for="email">Correo Electrónico:</label><br>
                <input type="email" id="email" name="email" required>
                <span class="error" id="error-email">Debe ingresar un correo válido.</span>
            </p>
            <p>
                <label for="telefono">Teléfono:</label><br>
                <input type="tel" id="telefono" name="telefono" required>
                <span class="error" id="error-telefono">Debe ingresar un teléfono válido (9 dígitos).</span>
            </p>
            <p>
                <label for="region">Región:</label><br>
                <select id="region" name="region" required>
                    <option value="">Seleccione una región</option>
                    {% for region in regiones %}
                        <option value="{{ region.id }}">{{ region.nombre }}</option>
                    {% endfor %}
                </select>
                <span class="error" id="error-region">
                   Debe seleccionar una región.
                </span>
            </p>
            <p>
                <label for="comuna">Comuna:</label><br>
                <select id="comuna" name="comuna" required>
                    <option value="">Seleccione una comuna</option>
                    {% for comuna in comunas %}
                        <option value="{{ comuna.id }}">{{ comuna.nombre }}</option>
                    {% endfor %}
                </select>
                <span class="error" id="error-comuna">
                   Debe seleccionar una comuna.
                </span>
            </p>

            <button type="submit" class="boton">Registrar Voluntario</button>
        </form>

        <script src="{{ url_for('static', filename='js/voluntario.js') }}"></script>
    </body>
</html>
