<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>

<body>
    <h1>Estadísticas</h1>

   <div id="grafico-lineas" style="width:100%; max-width:800px; height:400px; margin:20px auto;"></div>
    <div id="grafico-torta" style="width:100%; max-width:800px; height:400px; margin:20px auto;"></div>
    <div id="grafico-barras" style="width:100%; max-width:800px; height:400px; margin:20px auto;"></div>

    <p style="text-align: center; margin: 30px 0;">
        <a href="{{ url_for('index') }}">Volver</a>
    </p>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
        try {
                const res = await fetch('/api/estadisticas');
                const data = await res.json();

                // 1. Gráfico de Líneas: Avistamientos por día
                Highcharts.chart('grafico-lineas', {
                    chart: { type: 'line' },
                    title: { text: 'Cantidad de Avistamientos por Día' },
                    xAxis: { categories: data.lineas.labels, title: { text: 'Días' } },
                    yAxis: { title: { text: 'Cantidad de Avistamientos' } },
                    series: [{ name: 'Avistamientos', data: data.lineas.data }]
                });

                // 2. Gráfico de Torta: Avistamientos por tipo de ave
                const tortaSeriesData = data.torta.labels.map((label, idx) => ({
                    name: label,
                    y: data.torta.data[idx]
                }));

                Highcharts.chart('grafico-torta', {
                    chart: { type: 'pie' },
                    title: { text: 'Total de Avistamientos por Tipo de Ave' },
                    series: [{ name: 'Avistamientos', data: tortaSeriesData }]
                });

                // 3. Gráfico de Barras: Voluntarios por comuna
                Highcharts.chart('grafico-barras', {
                    chart: { type: 'column' },
                    title: { text: 'Total de Voluntarios Registrados por Comuna' },
                    xAxis: { categories: data.barras.labels, title: { text: 'Comunas' } },
                    yAxis: { title: { text: 'Total de Voluntarios' } },
                    series: [{ name: 'Voluntarios', data: data.barras.data }]
                });

            } catch (err) {
                console.error('Error al cargar las estadísticas:', err);
            }
        });
    </script>

</body>

</html>
